services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - uploads:/app/uploads
      - db:/app/data
    environment:
      # Infrastructure / security (everything else is managed in /admin/settings)
      - NODE_ENV=production
      - DATABASE_URL=/app/data/pixfete.db
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - JWT_SECRET=${JWT_SECRET}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
      # First-boot seed so local uploads land in the mounted volume by default.
      - UPLOADS_DIR=/app/uploads
    healthcheck:
      # busybox `wget` ships in the oven/bun alpine image; `curl` does not.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      # NEXT_PUBLIC_* are inlined into the client bundle at build time, so they
      # must be passed as build args — not only as runtime `environment`.
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:3001}
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads:
    driver: local
  db:
    driver: local
